name: CI

# Every push and pull request: build and test (job "test"), then build the Windows installer and check the packaged app (job "installer").
# A tag like v0.1.0 additionally attaches the installer to a draft GitHub Release (docs/RELEASING.md). The Windows runner has no
# Smart App Control, which is why the desktop window is checked here (see docs/PROGRESS.md, task C1).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the hygiene check scans the whole history (G2, S1)

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # Root dependencies (Electron, electron-builder, Playwright, jsdom); the postinstall script installs ui/ as well
      - name: Install
        run: npm ci

      - name: Nothing private is tracked
        run: node scripts/check-hygiene.cjs

      - name: UI build
        run: npm run build:ui

      - name: The committed build output matches a fresh build
        shell: bash
        run: git diff --exit-code -- src/ui.js src/ui.css

      - name: Engine, content, data and desktop helper tests
        run: npm test

      - name: Browser export builds from the samples
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -SkipPdf

      - name: Sample studies certify
        run: python tools/audit-study.py --samples

      - name: Desktop smoke test (every sidebar entry, content, data, Algorithm tab, console)
        run: npm run smoke

  installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to create the draft release on a version tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install
        run: npm ci

      - name: The tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Build the installer
        run: npm run dist

      - name: Fuses are set on the packaged app
        shell: bash
        run: node node_modules/@electron/fuses/dist/bin.js read --app dist-installer/win-unpacked/Kartotek.exe | tee fuses.txt && grep -q "RunAsNode is Disabled" fuses.txt && grep -q "OnlyLoadAppFromAsar is Enabled" fuses.txt

      # Installs silently into a temporary folder, installs again (an update), runs the smoke test against the INSTALLED app,
      # uninstalls, and checks after every step that the user-data folder is untouched
      - name: Installer, update, installed-app smoke test and uninstall
        shell: pwsh
        run: node scripts/check-installer.cjs

      - name: Checksums
        shell: bash
        run: |
          cd dist-installer
          sha256sum Kartotek-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: kartotek-installer
          path: |
            dist-installer/Kartotek-Setup-*.exe
            dist-installer/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

      # A draft release: the owner reads it and presses Publish (docs/RELEASING.md)
      - name: Draft release with the installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/__VERSION__/${version}/g" .github/release-notes.md > release-notes.txt
          gh release create "${GITHUB_REF_NAME}" \
            --draft --verify-tag \
            --title "Kartotek ${version}" \
            --notes-file release-notes.txt \
            "dist-installer/Kartotek-Setup-${version}.exe#Kartotek-Setup-${version}.exe (Windows 10/11, 64-bit)" \
            "dist-installer/SHA256SUMS.txt#SHA256SUMS.txt"
